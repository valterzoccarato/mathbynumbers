<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeroids</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="back-link">← Back to site</a>
        <div class="lang-switch">
            <a href="index.html">IT</a>
            <a href="index_en.html" class="current">EN</a>
        </div>
    </div>
    <div class="game-container">
        <div class="hud">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
            <div class="ammo">Ammo: <span id="ammo">40</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameOver" class="game-over hidden">
            <h2>GAME OVER</h2>
            <p>Final score: <span id="finalScore">0</span></p>

            <div id="newRecordForm" class="new-record hidden">
                <p class="new-record-label">New high score! Enter your initials:</p>
                <input id="initialsInput" class="initials-input" maxlength="3" placeholder="AAA" autocomplete="off">
                <button id="saveRecordBtn">Save</button>
            </div>

            <div id="highscoreListGameOver" class="highscores"></div>

            <button id="restartBtn">Play again</button>
        </div>
        <div id="startScreen" class="start-screen">
            <h1>NUMEROIDS</h1>
            <p>Use the arrow keys to move</p>
            <p>Press SPACE to shoot</p>
            <p>Hit a number: it splits into that many smaller asteroids</p>
            <button id="startBtn">Start</button>

            <div class="highscores-panel">
                <h3>High scores</h3>
                <div id="highscoreListStart" class="highscores"></div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
